<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./three160/build/three.module.js","three/addons/":"./three160/examples/jsm/"}}</script>
</head><body style="margin:0">
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W = 1200, H = 1200;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf3f2ef);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(2, 6, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.camera.near = 0.1; key.shadow.camera.far = 20;
scene.add(key);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.01, 100);
const gltf = await new GLTFLoader().loadAsync('./shoe.glb');
const parser = gltf.parser, json = parser.json;
const variants = json.extensions.KHR_materials_variants.variants.map(v => v.name);
const model = gltf.scene;
const meshes = [];
model.traverse(o => { if (o.isMesh) { o.castShadow = true; meshes.push(o); } });
// fit: put the sole on the ground and centre it
const box = new THREE.Box3().setFromObject(model);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
model.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
const pivot = new THREE.Group(); pivot.add(model); scene.add(pivot);
const r = Math.max(size.x, size.z);
const dist = r * 2.05;
camera.position.set(0, size.y * 1.9, dist); camera.lookAt(0, size.y * 0.42, 0);
key.shadow.camera.left = -r; key.shadow.camera.right = r; key.shadow.camera.top = r; key.shadow.camera.bottom = -r;
async function setVariant(idx) {
  for (const m of meshes) {
    const a = parser.associations.get(m); if (!a || a.meshes === undefined) continue;
    const prim = json.meshes[a.meshes].primitives[a.primitives];
    const maps = prim.extensions?.KHR_materials_variants?.mappings || [];
    const hit = maps.find(x => x.variants.includes(idx));
    if (hit) m.material = await parser.getDependency('material', hit.material);
  }
}
window.info = { variants, size: size.toArray() };
window.frame = async (variant, i, n) => {
  await setVariant(variant);
  pivot.rotation.y = -i * 2 * Math.PI / n;
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/jpeg', 0.9);
};
// The stops after the turn: the top, the sole and a close-up of the stitching, all from the same real scan.
const home = { pos: camera.position.clone(), fov: camera.fov, key: key.position.clone() };
window.view = async (variant, kind) => {
  await setVariant(variant);
  pivot.rotation.set(0, 0, 0); pivot.position.set(0, 0, 0); ground.visible = true;
  camera.fov = home.fov;
  if (kind === 'top') {
    // The light straight above, so the shadow lies under the shoe: lit from the side, it fell beside the shoe and
    // read as a grey copy of it.
    pivot.rotation.y = -Math.PI / 2; key.position.set(0.15, 8, 0.25);
    camera.position.set(0, r * 2.35, r * 0.1); camera.lookAt(0, 0, 0);
  } else if (kind === 'sole') {
    // At a slant, as the scan shows its sole, lit low from the side and a little darker: a white sole seen straight
    // on and lit evenly was barely there on the milk-white backdrop. Now the tread shades and the upper outlines it.
    pivot.rotation.set(0.82 * Math.PI, 0.55 * Math.PI, 0.12 * Math.PI); pivot.position.y = size.y; ground.visible = false;
    key.position.set(-6, 0.5, 2); renderer.toneMappingExposure = 0.65;
    camera.position.set(r * 0.45, size.y + r * 1.08, r * 1.13); camera.lookAt(-r * 0.07, size.y * 0.64, 0); // centred, as large as the turn
  } else {
    camera.fov = 18;
    camera.position.set(r * 0.9, size.y * 1.1, r * 0.9); camera.lookAt(r * 0.12, size.y * 0.4, 0);
  }
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  const url = renderer.domElement.toDataURL('image/jpeg', 0.92);
  pivot.rotation.set(0, 0, 0); pivot.position.set(0, 0, 0); ground.visible = true;
  key.position.copy(home.key); renderer.toneMappingExposure = 1.0;
  camera.fov = home.fov; camera.position.copy(home.pos); camera.lookAt(0, size.y * 0.42, 0); camera.updateProjectionMatrix();
  return url;
};
window.ready = true;
</script></body></html>
