name: Demo APK

# An Android build that runs without a server (recorded data from app/demo/api.json), published as the
# "demo" pre-release so it can be downloaded straight onto a phone.
on:
  push:
    branches: [claude/initial-code, main]
    paths: ["app/**", ".github/workflows/demo-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      # Every demo photo's small copy, cut-out and original must be the same picture, or the page draws two shoes
      # on top of each other. Nothing is built or published when they are not.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==12.3.0 && python demo/check_media.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=DEMO=true
      - run: cp build/app/outputs/flutter-apk/app-release.apk vitrina-demo.apk
      - name: Publish to the demo pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Серверсіз демо: тауарлар, 360° витрина, таңдаулылар мен чат телефонда іштегі деректермен жұмыс істейді. Commit ${GITHUB_SHA::7}."
          if gh release view demo >/dev/null 2>&1; then
            gh release edit demo --notes "$notes"
          else
            gh release create demo --prerelease --title "VITRINA демо" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload demo vitrina-demo.apk --clobber
