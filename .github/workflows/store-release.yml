name: Store release

# The Android App Bundle for Google Play: signed with the upload key kept in the repository secrets and pointed at the
# real server. Run by hand from the Actions tab; the bundle is attached to the run, never published anywhere.
# Every change to the Android build also builds once with a throwaway key, so a broken signing setup shows up long
# before the day a store build is needed.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Server address, for example https://vitrina.kz/api/v1"
        required: true
  push:
    branches: [claude/initial-code, main]
    paths: ["app/android/**", "app/pubspec.*", ".github/workflows/store-release.yml"]

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      VITRINA_UPLOAD_STORE_PASSWORD: throwaway
      VITRINA_UPLOAD_KEY_ALIAS: upload
      VITRINA_UPLOAD_KEY_PASSWORD: throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Throwaway upload key
        run: |
          echo "VITRINA_UPLOAD_STORE_FILE=$RUNNER_TEMP/check.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/check.jks" -storepass throwaway -keypass throwaway \
            -alias upload -keyalg RSA -keysize 2048 -validity 2 -dname "CN=VITRINA signing check"
      - name: A store build without the server address is refused
        run: |
          flutter build appbundle --release > refused.log 2>&1 || true
          cat refused.log
          grep -q "A store build needs --dart-define=API_BASE" refused.log
          test ! -e build/app/outputs/bundle/release/app-release.aab
      - name: A store build with it is signed with the upload key
        run: |
          flutter build appbundle --release --dart-define=API_BASE=https://example.kz/api/v1
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee cert.txt
          grep -q "CN=VITRINA signing check" cert.txt
      - name: The demo APK still builds with the key present
        run: flutter build apk --release --dart-define=DEMO=true

  bundle:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    # The upload key and its passwords reach only the two steps that need them, and the actions here are pinned to
    # commits, so a moved tag cannot read them.
    steps:
      - name: Server address
        working-directory: .
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          case "$API_BASE" in
            https://*/api/v1) ;;
            *) echo "::error::The server address must look like https://YOUR-DOMAIN/api/v1"; exit 1 ;;
          esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build, signed with the upload key
        env:
          API_BASE: ${{ inputs.api_base }}
          KEYSTORE_BASE64: ${{ secrets.VITRINA_UPLOAD_KEYSTORE_BASE64 }}
          VITRINA_UPLOAD_STORE_PASSWORD: ${{ secrets.VITRINA_UPLOAD_STORE_PASSWORD }}
          VITRINA_UPLOAD_KEY_ALIAS: ${{ secrets.VITRINA_UPLOAD_KEY_ALIAS }}
          VITRINA_UPLOAD_KEY_PASSWORD: ${{ secrets.VITRINA_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ] || missing="$missing VITRINA_UPLOAD_KEYSTORE_BASE64"
          [ -n "$VITRINA_UPLOAD_STORE_PASSWORD" ] || missing="$missing VITRINA_UPLOAD_STORE_PASSWORD"
          [ -n "$VITRINA_UPLOAD_KEY_ALIAS" ] || missing="$missing VITRINA_UPLOAD_KEY_ALIAS"
          [ -n "$VITRINA_UPLOAD_KEY_PASSWORD" ] || missing="$missing VITRINA_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Add these repository secrets first (see app/README.md):$missing"
            exit 1
          fi
          export VITRINA_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$VITRINA_UPLOAD_STORE_FILE"
          # Google Play takes each version number once: it grows with every run and every re-run of one.
          flutter build appbundle --release --dart-define=API_BASE="$API_BASE" \
            --build-number=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
      - name: The key is gone from the machine
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - name: Signed with the upload key, not the debug one
        env:
          CERT_SHA256: ${{ vars.VITRINA_UPLOAD_CERT_SHA256 }}
        run: |
          keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | tee cert.txt
          grep -q "^Owner:" cert.txt || { echo "::error::The bundle is not signed"; exit 1; }
          if grep -q "CN=Android Debug" cert.txt; then echo "::error::Signed with the debug key"; exit 1; fi
          if [ -n "$CERT_SHA256" ] && ! grep -qi "SHA256: *$CERT_SHA256" cert.txt; then
            echo "::error::Signed with a key other than VITRINA_UPLOAD_CERT_SHA256"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitrina-${{ github.run_number }}-${{ github.run_attempt }}.aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
