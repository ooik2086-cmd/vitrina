name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg  # promo videos
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitrina
          POSTGRES_PASSWORD: vitrina
          POSTGRES_DB: vitrina_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitrina" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      VITRINA_TEST_DATABASE_URL: postgresql+psycopg://vitrina:vitrina@localhost:5432/vitrina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg  # promo videos
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_api tests.test_cutout -v

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: vitrina-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: API answers after migrations
        run: for i in $(seq 30); do curl -fsS http://localhost:8000/api/v1/listings && exit 0; sleep 2; done; exit 1
      - if: always()
        run: docker compose logs api
