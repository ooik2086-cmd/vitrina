name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg  # promo videos
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v

  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a request stuck on a lock fails here, not after six hours
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vitrina
          POSTGRES_PASSWORD: vitrina
          POSTGRES_DB: vitrina_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vitrina" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      VITRINA_TEST_DATABASE_URL: postgresql+psycopg://vitrina:vitrina@localhost:5432/vitrina_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg  # promo videos
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_api tests.test_cutout tests.test_races tests.test_migrations.PostgresMigrationTests -v

  # The shared listing page's 360° turn in a real browser: its script under the page's own Content-Security-Policy.
  share-page-browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      VITRINA_BROWSER_TESTS: "1"  # a missing browser fails instead of skipping
      NODE_PATH: ${{ github.workspace }}/.pw/node_modules
    permissions:
      contents: read  # it runs code downloaded from npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: |
          npm install --no-save --ignore-scripts --prefix "$GITHUB_WORKSPACE/.pw" playwright@1.56.1
          "$GITHUB_WORKSPACE/.pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium  # headless only
      - run: python -m unittest tests.test_share_browser -v

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Every demo photo's small copy, cut-out and original show the same picture (two shoes drawn over each other
      # otherwise), and every file exists.
      - run: python -m pip install Pillow==12.3.0 && python demo/check_media.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: vitrina-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: API answers after migrations
        run: for i in $(seq 30); do curl -fsS http://localhost:8000/api/v1/listings && exit 0; sleep 2; done; exit 1
      - if: always()
        run: docker compose logs api
