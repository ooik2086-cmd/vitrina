# Local stack: API + PostgreSQL. `docker compose up --build`, then http://localhost:8000/docs
# Development only: secrets below are placeholders and the OTP is returned in responses.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vitrina
      POSTGRES_PASSWORD: vitrina
      POSTGRES_DB: vitrina
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vitrina"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      VITRINA_DATABASE_URL: postgresql+psycopg://vitrina:vitrina@db:5432/vitrina
      VITRINA_PUBLIC_MEDIA_URL: http://localhost:8000/media
      VITRINA_DEBUG_OTP: "1"
      VITRINA_CORS_ORIGINS: http://localhost:5000
      VITRINA_JOBS_INTERVAL: "300"   # expire unpaid orders, refund ignored ones, auto-complete, review reminders
      VITRINA_PHOTO_WORK: worker     # cut-outs and search vectors are made by the photos service below
    ports: ["8000:8000"]
    volumes: [media:/data/media, private:/data/private]

  # Cut-outs, small copies and search vectors of new and edited listings, out of the API so buyers are not slowed.
  photos:
    build: ./backend
    command: ["python", "-m", "vitrina_api.photo_worker"]
    depends_on:
      api:
        condition: service_healthy   # the API has run the migrations
    environment:
      VITRINA_DATABASE_URL: postgresql+psycopg://vitrina:vitrina@db:5432/vitrina
      VITRINA_PUBLIC_MEDIA_URL: http://localhost:8000/media
    healthcheck:
      disable: true   # it answers no HTTP
    volumes: [media:/data/media, private:/data/private]

volumes:
  pgdata:
  media:
  private:
