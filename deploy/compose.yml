# A live server: PostgreSQL, the API (2 processes), the photo worker, phone alerts, the timed jobs and Caddy, which gets the
# HTTPS certificate for VITRINA_DOMAIN by itself and is the only thing open to the internet (ports 80 and 443).
# Sized for 2 cores and 4 GB. Settings and secrets come from deploy/.env (setup.sh makes it); see deploy/README.md.
#
#   docker compose -f deploy/compose.yml up -d --build
name: vitrina

x-logs: &logs   # without a cap, container logs grow until the disk is full
  driver: json-file
  options: {max-size: "10m", max-file: "5"}

x-app: &app
  build: ../backend
  image: vitrina-api
  env_file: .env
  environment: &app-env
    VITRINA_ENV: production   # the API refuses to start while anything in .env is unsafe, and says what
    VITRINA_DEBUG_OTP: "0"
    VITRINA_AUTO_CREATE_SCHEMA: "0"
    VITRINA_PHOTO_WORK: worker
    VITRINA_DATABASE_URL: postgresql+psycopg://vitrina:${POSTGRES_PASSWORD:?run deploy/setup.sh or fill deploy/.env}@db:5432/vitrina
    # VITRINA_STORAGE=disk keeps the files here (empty with s3); Caddy serves the photos' volume at /media.
    VITRINA_MEDIA_DIR: /data/media
    VITRINA_PRIVATE_MEDIA_DIR: /data/private
  volumes: [media:/data/media, private:/data/private]
  restart: unless-stopped
  logging: *logs

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vitrina
      POSTGRES_DB: vitrina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/setup.sh or fill deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "vitrina"]
      interval: 5s
      retries: 10
    shm_size: 256mb
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logs
    networks: [inner]   # no port: only the services below reach it

  api:
    <<: *app
    environment:
      <<: *app-env
      VITRINA_WORKERS: "2"         # one per core
      VITRINA_JOBS_INTERVAL: "0"   # two processes: the jobs service below runs them once
      # Client addresses (rate limits) and https links are read from the headers only when Caddy sends them.
      FORWARDED_ALLOW_IPS: 172.31.250.10
    depends_on:
      db: {condition: service_healthy}
    networks: [inner, edge]

  # Cut-outs, small copies and search vectors of new and edited listings. One only: two would cut out the same
  # listing side by side. Measured: up to 1.7 GB while it cuts out a listing; the cap keeps the database safe.
  photos:
    <<: *app
    command: ["python", "-m", "vitrina_api.photo_worker"]
    depends_on:
      api: {condition: service_healthy}   # the API has run the migrations
    stop_grace_period: 150s   # it finishes the listing it is on (~2 minutes) before stopping
    mem_limit: 2500m
    # In its own container its lower priority (nice) no longer yields to the API: a quarter of the API's CPU
    # weight does, so buyers are answered first while a listing is cut out. Idle CPU it still uses in full.
    cpu_shares: 256
    healthcheck:   # it touches this file after every listing and every idle look
      test: ["CMD-SHELL", "find /tmp/photo_worker.alive -mmin -10 | grep -q ."]
      interval: 60s
      start_period: 120s
    networks: [inner]

  # Every new notification to the person's phones within seconds, through Firebase (vitrina_api/push.py). Without
  # deploy/secrets/firebase.json it only waits for it.
  push:
    <<: *app
    command: ["python", "-m", "vitrina_api.push"]
    environment:
      <<: *app-env
      # The Firebase key, put there by hand (deploy/README.md), seen by this service only. Looked for every minute.
      VITRINA_FCM_CREDENTIALS_FILE: /run/vitrina-secrets/firebase.json
    volumes: [./secrets:/run/vitrina-secrets:ro]   # needs no photos
    init: true
    depends_on:
      api: {condition: service_healthy}   # the API has run the migrations
    mem_limit: 256m
    healthcheck:   # it touches this file on every look, at least once a minute
      test: ["CMD-SHELL", "find /tmp/push.alive -mmin -5 | grep -q ."]
      interval: 60s
      start_period: 60s
      start_interval: 5s
    networks: [inner]

  # Unpaid orders let go, ignored ones refunded, unconfirmed ones completed, reminders: every 5 minutes.
  jobs:
    <<: *app
    command: ["sh", "-c", "while :; do if python -m vitrina_api.jobs; then touch /tmp/jobs.ok; else echo 'jobs pass failed'; fi; sleep 300; done"]
    init: true   # so a stop ends the sleep at once
    healthcheck:   # unhealthy once no pass has worked for 15 minutes (three in a row failed)
      test: ["CMD-SHELL", "find /tmp/jobs.ok -mmin -15 | grep -q ."]
      interval: 60s
      start_period: 60s
      start_interval: 5s
    depends_on:
      api: {condition: service_healthy}
    networks: [inner]

  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      VITRINA_DOMAIN: ${VITRINA_DOMAIN:?set VITRINA_DOMAIN in deploy/.env}
      VITRINA_TLS: "${VITRINA_TLS:?set VITRINA_TLS in deploy/.env to an email for Let's Encrypt}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # the certificate and its key: keep it, or a new one is asked for on every start
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      media: {condition: service_healthy}
    healthcheck:   # its admin endpoint, on the container's own loopback only
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      start_period: 20s
      start_interval: 2s
    restart: unless-stopped
    logging: *logs
    networks:
      edge: {ipv4_address: 172.31.250.10}

  # The photos' volume served at /media (VITRINA_STORAGE=disk; empty with s3). Not the Caddy above: this one holds
  # no certificate key, nothing but the photos (read only), and runs as nobody (the files are world-readable).
  media:
    image: caddy:2.8
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile"]
    user: "65534:65534"
    read_only: true
    environment: {XDG_DATA_HOME: /tmp, XDG_CONFIG_HOME: /tmp}
    tmpfs: [/tmp]
    volumes:
      - ./Caddyfile.media:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      start_period: 10s
      start_interval: 2s
    mem_limit: 128m
    restart: unless-stopped
    logging: *logs
    networks: [edge]

networks:
  inner:
  edge:
    ipam:
      config: [{subnet: 172.31.250.0/24}]

volumes:
  pgdata:
  media:
  private:
  caddy_data:
  caddy_config:
