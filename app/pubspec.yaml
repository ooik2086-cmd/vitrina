name: vitrina
description: VITRINA AI — аяқкиім маркетплейсі (Android бірінші).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0" # PageTransitionsBuilder.delegatedTransition and PredictiveBack fallbackColor

dependencies:
  camera: ^0.12.1
  clock: ^1.1.1
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true
  assets:
    - demo/api.json
    - assets/textures/grain.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
