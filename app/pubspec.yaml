name: vitrina
description: VITRINA AI — аяқкиім маркетплейсі (Android бірінші).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.35.0" # PageTransitionsBuilder.delegatedTransition and PredictiveBack fallbackColor

dependencies:
  camera: ^0.12.1
  clock: ^1.1.1
  flutter:
    sdk: flutter
  http: ^1.2.2
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  video_player: ^2.14.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image_picker_platform_interface: ^2.11.2
  camera_platform_interface: ^2.15.0
  video_player_platform_interface: ^6.6.0

flutter:
  uses-material-design: true
  assets:
    - demo/api.json
    # The demo's 3D model and first 3D pictures, carried so the 3D shows at once (demo.dart carriedAsset).
    - demo/first/
    - demo/media/models/shoe-1024.glb
    - assets/textures/grain.png
    - assets/viewer/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
